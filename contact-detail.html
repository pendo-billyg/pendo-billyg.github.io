<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Details - BillyCRM</title>
<script src="assets/pendoSnippet.js"></script>
<!-- Start of d3v-pendo-ts-test Zendesk Widget script -->
<script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=70be359a-9c3d-41ee-9923-3011e9451a80"> </script>
<!-- End of d3v-pendo-ts-test Zendesk Widget script -->
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="contact-detail">

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">BillyCRM</span>
    </div>
    <a class="nav-item" data-page="dashboard" href="dashboard.html">Dashboard</a>
    <a class="nav-item active" data-page="contacts"  href="contacts.html">Contacts</a>
    <a class="nav-item" data-page="tickets"   href="tickets.html">Tickets</a>
    <a class="nav-item" data-page="settings"  href="settings.html">Settings</a>
  </aside>

  <main class="content">

    <div class="page-header">
      <p class="page-title" id="page-title">Contacts</p>
      <div class="user-menu-container" id="user-menu-wrapper"></div>
    </div>

    <div id="contact-detail-content"></div>

  </main>
</div>

<!-- CONTACT FORM MODAL -->
<div class="modal-backdrop" id="contact-modal" hidden>
  <form class="modal" id="contact-form">
    <h3 class="modal-title" id="contact-modal-title">Add contact</h3>

    <div class="form-field form-field-required">
      <label for="cf-name">Name</label>
      <input id="cf-name" name="name" type="text" required autocomplete="off" />
    </div>
    <div class="form-field form-field-required">
      <label for="cf-email">Email</label>
      <input id="cf-email" name="email" type="email" required autocomplete="off" />
    </div>
    <div class="form-field form-field-required">
      <label for="cf-company">Company</label>
      <input id="cf-company" name="company" type="text" required autocomplete="off" />
    </div>
    <div class="form-field form-field-required">
      <label for="cf-status">Status</label>
      <select id="cf-status" name="status" required>
        <option value="active">Active</option>
        <option value="pending">Pending</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="form-field">
      <label for="cf-role">Role <span class="optional">(optional)</span></label>
      <input id="cf-role" name="role" type="text" autocomplete="off" />
    </div>
    <div class="form-field">
      <label for="cf-last-contacted">Last contacted <span class="optional">(optional)</span></label>
      <input id="cf-last-contacted" name="lastContacted" type="date" />
    </div>
    <div class="form-field">
      <label for="cf-owner">Owner <span class="optional">(optional)</span></label>
      <input id="cf-owner" name="owner" type="text" autocomplete="off" />
    </div>

    <div class="modal-buttons">
      <button type="button" class="secondary" id="cancel-contact">Cancel</button>
      <button type="submit" class="primary" id="save-contact">Save contact</button>
    </div>
  </form>
</div>

<!-- SIGN-IN MODAL -->
<div class="modal-backdrop" id="signin-modal" hidden>
  <form class="modal" id="signin-form">
    <h3 class="modal-title">Sign in</h3>
    <p style="margin: 0 0 14px; font-size: 12px; color: var(--text-secondary);">
      Identifies you in BillyCRM and (when Pendo is installed) flows through to <code style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">pendo.identify()</code>.
    </p>

    <div class="form-field form-field-required">
      <label for="si-visitor-id">Visitor ID</label>
      <input id="si-visitor-id" name="visitorId" type="text" required autocomplete="off" />
    </div>
    <div class="form-field">
      <label for="si-visitor-name">Visitor name <span class="optional">(optional)</span></label>
      <input id="si-visitor-name" name="visitorName" type="text" autocomplete="off" />
    </div>
    <div class="form-field">
      <label for="si-visitor-email">Visitor email <span class="optional">(optional)</span></label>
      <input id="si-visitor-email" name="visitorEmail" type="email" autocomplete="off" />
    </div>
    <div class="form-field form-field-required">
      <label for="si-account-id">Account ID</label>
      <input id="si-account-id" name="accountId" type="text" required autocomplete="off" />
    </div>
    <div class="form-field">
      <label for="si-account-name">Account name <span class="optional">(optional)</span></label>
      <input id="si-account-name" name="accountName" type="text" autocomplete="off" />
    </div>

    <div class="modal-buttons">
      <button type="button" class="secondary" id="cancel-signin">Cancel</button>
      <button type="submit" class="primary">Sign in</button>
    </div>
  </form>
</div>

<script src="assets/app.js"></script>

</body>
</html>
